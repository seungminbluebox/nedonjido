<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - 주식 기록 시스템</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* 로그인 페이지 전용 스타일 */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f5f6fa;
      }
      .login-container {
        text-align: center;
        background: white;
        padding: 3rem 4rem;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .login-container h1 {
        margin-bottom: 0.5rem;
      }
      .login-container p {
        margin-bottom: 2rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>환영합니다!</h1>
      <p>서비스를 이용하려면 로그인이 필요합니다.</p>
      <button id="login-btn">🚀 Google 계정으로 시작하기</button>
    </div>

    <script type="module" src="scripts/auth.js"></script>
  </body>
</html>
