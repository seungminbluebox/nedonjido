<!-- categories/stocks.html -->
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📈 종목 실적</title>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="/scripts/layout.js"></script>
    <script type="module" src="../scripts/stocks.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="sidebar-placeholder"></div>
      <main class="content">
        <h1>📋 종목 실적</h1>
        <section class="summary-section">
          <div class="summary-item">
            <h2>총 매수액</h2>
            <p id="total-purchase">0 원</p>
          </div>
          <div class="summary-item">
            <h2>총 평가액</h2>
            <p id="total-evaluation">0 원</p>
          </div>
          <div class="summary-item">
            <h2>총 손익 (수익률)</h2>
            <p id="total-profit-loss">0 원 (0.00%)</p>
          </div>
        </section>
        <div id="loading-spinner" class="spinner-container">
          <div class="spinner"></div>
          <p>데이터를 불러오는 중입니다...</p>
        </div>
        <div id="stock-list">
          <div class="table-wrapper">
            <table id="stock-table">
              <thead>
                <tr>
                  <th>티커</th>
                  <th>종목명</th>
                  <th>수량</th>
                  <th>평단가</th>
                  <th>통화</th>
                  <th>현재가</th>
                  <th>평가액</th>
                  <th>수익률</th>
                  <th>삭제</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <h2 style="cursor: pointer; color: #2c3e50" id="add-row">
          ➕ 종목 추가
        </h2>
        <button id="save-all" style="margin-top: 10px">
          💾 변경사항 저장하기
        </button>
      </main>
    </div>
  </body>
</html>
