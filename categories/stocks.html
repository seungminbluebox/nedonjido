<!-- categories/stocks.html -->
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📈 종목 실적</title>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="/scripts/layout.js"></script>
    <script type="module" src="../scripts/stocks.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="sidebar-placeholder"></div>

      <!-- 본문 영역 -->
      <main class="content">
        <h1>📋 종목 실적</h1>
        <div id="loading-spinner" class="spinner-container">
          <div class="spinner"></div>
          <p>데이터를 불러오는 중입니다...</p>
        </div>
        <div id="stock-list">
          <table id="stock-table">
            <thead>
              <tr>
                <th>티커</th>
                <th>종목명</th>
                <th>수량</th>
                <th>평단가</th>
                <th>통화</th>
                <th>현재가</th>
                <th>평가액</th>
                <th>수익률</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <h2 style="cursor: pointer; color: #2c3e50" id="add-row">
          ➕ 종목 추가
        </h2>
        <button id="save-all" style="margin-top: 10px">
          💾 변경사항 저장하기
        </button>
      </main>
    </div>
  </body>
</html>
