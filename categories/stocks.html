<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📈 종목 실적</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="container">
      <!-- 좌측 사이드바 -->
      <nav class="sidebar">
        <h2>📊 메뉴</h2>
        <ul>
          <li id="exchange-rate">💱 환율: 불러오는 중...</li>
          <li><a href="../index.html">홈</a></li>
          <li><a href="stocks.html">종목 실적</a></li>
          <li><a href="accounts.html">계좌 실적</a></li>
          <li><a href="total-assets.html">계좌 총액</a></li>
          <li><a href="deposits.html">입출금</a></li>
          <li><a href="dividends.html">배당</a></li>
          <li><a href="categories.html">카테고리</a></li>
          <li><a href="charts.html">시각화</a></li>
          <li id="logout-btn" style="cursor: pointer">🔒 로그아웃</li>
        </ul>
      </nav>

      <!-- 본문 영역 -->
      <main class="content">
        <h1>📋 종목 실적</h1>
        <div id="loading-spinner" class="spinner-container">
          <div class="spinner"></div>
          <p>데이터를 불러오는 중입니다...</p>
        </div>
        <div id="stock-list">
          <table id="stock-table">
            <thead>
              <tr>
                <th>티커</th>
                <th>종목명</th>
                <th>수량</th>
                <th>평단가</th>
                <th>통화</th>
                <th>현재가</th>
                <th>평가액</th>
                <th>수익률</th>
                <th>삭제</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <h2 style="cursor: pointer; color: #2c3e50" id="add-row">
          ➕ 종목 추가
        </h2>
        <button id="save-all" style="margin-top: 10px">
          💾 변경사항 저장하기
        </button>
      </main>
    </div>
    <script type="module" src="../main.js"></script>

    <script type="module" src="../scripts/stocks.js"></script>
  </body>
</html>
